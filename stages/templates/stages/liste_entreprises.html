<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Entreprises partenaires</title>
  </head>
  <body>
    <h1>Entreprises partenaires</h1>
    <ul>
      {% for entreprise in entreprises %}
        <li>{{ entreprise.nom }} — {{ entreprise.ville }} ({{ entreprise.secteur }})</li>
      {% empty %}
        <li>Aucune entreprise enregistrée pour le moment.</li>
      {% endfor %}
    </ul>
  </body>
</html>
