[project]
name = "suivi-stages"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "suivi_stages.settings"
python_files = ["test_*.py"]
